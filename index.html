<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Map</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #f4f4f4;
        font-family: Arial, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
      }

      .map-frame {
        width: min(90vw, 1100px);
        height: min(80vh, 800px);
        border: 2px solid #d0d0d0;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        background: #fff;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="map-frame">
      <iframe src="my_map.html" title="My map"></iframe>
    </div>
  </body>
</html>
